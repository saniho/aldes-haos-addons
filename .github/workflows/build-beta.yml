name: Build beta addon

on:
  push:
    branches: [main]
    paths:
      - "aldes-bridge-beta/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' aldes-bridge-beta/config.yaml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building beta version: $VERSION"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: aldes-bridge-beta
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/aldes-bridge-beta/amd64:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/aldes-bridge-beta/aarch64:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
