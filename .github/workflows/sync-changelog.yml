name: Sync CHANGELOG into addon directories

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy CHANGELOG into addon directories
        run: |
          cp CHANGELOG.md aldes-bridge/CHANGELOG.md
          cp CHANGELOG.md aldes-bridge-beta/CHANGELOG.md

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aldes-bridge/CHANGELOG.md aldes-bridge-beta/CHANGELOG.md
          git commit -m "chore: sync CHANGELOG.md into addon directories"
          git push
